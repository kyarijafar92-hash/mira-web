version: '3.7'
services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - '3000:3000'
    restart: unless-stopped

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa
    ports:
      - '80:80'
    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: dvwa
    restart: unless-stopped

  # Optional: simple monitoring service (httpbin) for testing
  httpbin:
    image: kennethreitz/httpbin
    container_name: httpbin
    ports:
      - '8000:80'
    restart: unless-stopped

networks:
  default:
    external: false
